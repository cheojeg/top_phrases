{{define "content"}}
{{block "sidebar" .}} {{end}}
<main class="container mx-auto p-4">
    <h1> Frase del dia </h1>
    {{range .Quotes}}
        <div class="max-w-lg mx-auto bg-white rounded-lg shadow-lg p-6  mb-3 mt-3">
            <ul class="space-y-4">
                <li>
                    {{ if eq .State "draft" }}
                    <span class="bg-yellow-100 text-yellow-800 text-sm font-medium me-2 px-2.5 py-0.5 rounded dark:bg-yellow-900 dark:text-yellow-300">Draft</span>
                    {{ else if eq .State "published" }}
                    <span class="bg-green-100 text-green-800 text-sm font-medium me-2 px-2.5 py-0.5 rounded dark:bg-green-900 dark:text-green-300">Published</span>
                    {{ else if eq .State "archived" }}
                    <span class="bg-gray-100 text-gray-800 text-sm font-medium me-2 px-2.5 py-0.5 rounded dark:bg-gray-700 dark:text-gray-300">Archived</span>
                    {{ end }}
                    <blockquote class="mt-4 text-xl text-gray-700 italic text-center">"{{ .Text }}"</blockquote>
                    <p class="text-lg text-gray-600 text-right">- {{ .Author }}</p>
                    <a href="/edit_quote/{{.ID}}">Editar</a>
                </li>
            </ul>
        </div>
    {{end}}
</main>
{{end}}
