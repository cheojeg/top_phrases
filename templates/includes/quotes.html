{{define "content"}}
<div class="bg-gray-100 p-8 rounded-lg shadow-lg w-full max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-center">Quotes</h1>
    <ul class="space-y-4">
        {{ range .Quotes }}
            <li class="bg-white p-4 rounded-lg shadow">
                <p class="text-gray-700">{{ .Text }}</p>
                <p class="text-gray-500 text-sm text-right">- {{ .Author }}</p>
            </li>
        {{ end }}
    </ul>
</div>
{{end}}
