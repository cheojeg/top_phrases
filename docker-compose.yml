version: "3.9"
services:
  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=top_quotes
    ports:
      - "5432:5432"
    volumes:
      - data-volume:/var/lib/postgresql/data
  api:
    container_name: image-name
    image: registry/image-name:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_DRIVER=postgres
      - DB_SOURCE=postgresql://root:secret@postgres:5432/top_quotes?sslmode=disable
      - MIGRATION_URL=file://db/migration
      - HTTP_SERVER_ADDRESS=0.0.0.0:8080
      - TOKEN_SYMETRIC_KEY=12345678901234567890123456789012
      - ACCESS_TOKEN_DURATION=15m
      - REFRESH_TOKEN_DURATION=24h
      - ADMIN_SECRET_CODE=aB3dE5fG7hI9jK1lM2nO4pQ6rS8tU0vW
    depends_on:
      - postgres
    entrypoint:
      [
        "/app/wait-for.sh",
        "postgres:5432",
        "--",
        "/app/start.sh"
      ]
    command: [ "/app/main", "top_phrases/cmd", "api" ]
volumes:
  data-volume: